<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Extension Board – Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a101c;--ink:#e8eef7;--mute:#8fa0b8;--line:#ffffff17;--ok:#35e0a1;--warn:#ffc247;--bad:#ff5470;--off:#6b7a90}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;font-variant-numeric:tabular-nums;background:radial-gradient(900px 500px at 85% -10%,#17386455,transparent),var(--bg)}
main{max-width:980px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;color:var(--mute);font-size:.9rem}
header b{color:var(--ink);font-size:1.15rem;font-weight:600}
.hero{border-radius:22px;padding:24px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;border:1px solid var(--line);background:linear-gradient(135deg,#0c4a44,#0b1d33);transition:background .5s}
body[data-state=offline] .hero{background:linear-gradient(135deg,#232c3b,#141b27)}
body[data-state=fault] .hero{background:linear-gradient(135deg,#6a1428,#2a0d17)}
.big{display:flex;align-items:center;gap:14px;font-size:clamp(1.9rem,6.5vw,3.2rem);font-weight:800;letter-spacing:-.02em;line-height:1.05}
.dot{width:.36em;height:.36em;border-radius:50%;background:var(--off);flex:none}
body[data-state=online] .dot{background:var(--ok);animation:pulse 1.8s ease-out infinite}
body[data-state=fault] .dot{background:var(--bad)}
@keyframes pulse{0%{box-shadow:0 0 0 0 #35e0a199}100%{box-shadow:0 0 0 .55em #35e0a100}}
.sub{margin:8px 0 0;color:#ffffffb8;font-size:.95rem}
.tp{text-align:right}.tp b{display:block;font-size:clamp(1.8rem,6vw,2.8rem);font-weight:800;line-height:1}
.tp span{color:#ffffffa0;font-size:.85rem}
.grid{display:grid;gap:14px;margin-top:14px;grid-template-columns:1fr}
@media(min-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.wide{grid-column:1/-1}}
.card{background:#ffffff0a;border:1px solid var(--line);border-radius:18px;padding:18px;transition:opacity .5s,filter .5s}
body[data-state=offline] .card{opacity:.5;filter:grayscale(.7)}
.row{display:flex;justify-content:space-between;align-items:center}
.card h2{margin:0;font-size:1rem;font-weight:600;color:var(--mute)}
.tag{font-size:.8rem;font-weight:600;padding:3px 11px;border-radius:99px;background:#ffffff14;color:var(--mute)}
.tag.on{background:#35e0a122;color:var(--ok)}
#s1tag,#s2tag{font-size:1rem;padding:6px 16px}
.swbtn{display:block;width:100%;margin-top:12px;padding:12px;border:0;border-radius:12px;font-weight:600;font-size:1rem;font-family:inherit;background:var(--ok);color:#052b1f;cursor:pointer}
.swbtn.off{background:#ff547022;color:var(--bad);border:1px solid #ff547066}
.swbtn:disabled{opacity:.35;cursor:not-allowed}
.msg{min-height:1.2em;margin:10px 4px 0;color:var(--warn);font-size:.9rem}#s1tag.on,#s2tag.on{box-shadow:0 0 16px #35e0a155}
.gauge{position:relative;width:170px;margin:14px auto 6px}
.gauge svg{display:block;width:100%;transform:rotate(-90deg)}
.gauge circle{fill:none;stroke-width:9;stroke-linecap:round}
.tr{stroke:#ffffff12}.fg{stroke:var(--ok);transition:stroke-dasharray .6s,stroke .3s}
.fg.warn{stroke:var(--warn)}.fg.bad{stroke:var(--bad)}
.gv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gv b{font-size:2.1rem;font-weight:800;line-height:1}.gv span{font-size:.8rem;color:var(--mute);margin-top:2px}
.pair{display:flex;justify-content:center;gap:12px}.pair .gauge{width:50%;max-width:150px;margin:14px 0 6px}.pair .gv b{font-size:1.6rem}
.hint{text-align:center;margin:4px 0 0;font-size:.85rem;color:var(--mute)}
.stats{display:flex;gap:28px;margin-top:6px}
.stats b{display:block;font-size:1.5rem;font-weight:800}.stats span{font-size:.8rem;color:var(--mute)}
svg.sp{width:100%;height:90px;display:block;margin-top:12px}
.sp polyline{fill:none;stroke:var(--ok);stroke-width:2.2;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.sp polygon{fill:#35e0a118}
footer{margin-top:18px;font-size:.78rem;color:var(--mute)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-state="offline">
<main>
  <header><b>Smart Extension Board</b><span id="clock"></span></header>

  <section class="hero" aria-live="polite">
    <div><div class="big"><span class="dot"></span><span id="stText">Waiting for device</span></div><p class="sub" id="stSub">No data received yet.</p></div>
    <div class="tp"><b id="tot">–</b><span>Total power (VA)</span></div>
  </section>

  <p class="msg" id="ctlMsg"></p>
  <div class="grid" id="grid"></div>

  <div class="grid" id="grid2">
    <section class="card">
      <div class="row"><h2>Power over time</h2><span class="tag" id="fan">Fan –</span></div>
      <div class="stats"><div><b id="wh">0</b><span>Energy this visit (Wh)</span></div><div><b id="pk">0</b><span>Peak (VA)</span></div></div>
      <svg class="sp" viewBox="0 0 300 60" preserveAspectRatio="none" role="img" aria-label="Total power over the last readings"><polygon id="area" points=""/><polyline id="spark" points=""/></svg>
    </section>
  </div>
</main>

<script>
const CONFIG = {
  DATA_URL: "https://smart-electriccal-extension-default-rtdb.asia-southeast1.firebasedatabase.app/device.json",
  POLL_MS: 2000, OFFLINE_AFTER_MS: 8000,
  VOLTAGE: 230, OVERLOAD_A: 5, OVERHEAT_C: 45, FAN_ON_C: 35
};
/* JSON: {"i1":0.42,"i2":1.1,"t":31,"r1":1,"r2":0,"fault":"none","up":1234}  ("up" must change each upload). Add ?demo to preview. */

const $ = id => document.getElementById(id);
const demo = new URLSearchParams(location.search).has("demo");
const CIRC = 2 * Math.PI * 52;
let last = null, lastKey = null, lastChange = 0, hist = [], wh = 0, peak = 0, demoUp = 0;

const g = (id, sub) => `<div class="gauge"><svg viewBox="0 0 120 120"><circle class="tr" cx="60" cy="60" r="52"/><circle class="fg" id="${id}arc" cx="60" cy="60" r="52" stroke-dasharray="0 ${CIRC}"/></svg><div class="gv"><b id="${id}v">–</b><span>${sub}</span></div></div>`;
const card = (id, title, body) => `<section class="card"><div class="row"><h2>${title}</h2><span class="tag" id="${id}tag">–</span></div>${body}<p class="hint" id="${id}h">&nbsp;</p></section>`;
const gauge = (id, title, sub) => card(id, title, g(id, sub));
const pair = (id, title) => card(id, title, `<div class="pair">${g(id, "amps")}${g(id + "p", "VA")}</div><button class="swbtn" id="${id}btn" disabled>–</button>`);
$("grid").innerHTML = pair("s1", "Socket 1") + pair("s2", "Socket 2");
$("grid2").insertAdjacentHTML("afterbegin", gauge("tm", "Board temperature", "°C"));

/* ---- Switching from the website ----
   The page only sends a request ("set socket N to ON/OFF"). The board decides, and the page
   always shows the state the board reports back, so the physical buttons and the site never disagree. */
const rel = { 1: null, 2: null };
let pending = null;
const msg = t => { $("ctlMsg").textContent = t || ""; };
function getPw() {
  try { const p = sessionStorage.getItem("pw"); if (p) return p; } catch (e) {}
  return prompt("Control password:") || "";
}
async function sendCmd(n, want) {
  if (demo) return msg("Demo mode: switching is disabled.");
  if (pending) return;
  const pw = getPw(); if (!pw) return;
  pending = { n, want, until: Date.now() + 9000 }; msg("Sending…"); render();
  try {
    const r = await fetch(CONFIG.DATA_URL.replace("device.json", "cmd/" + encodeURIComponent(pw) + ".json"), { method: "PUT", body: JSON.stringify({ id: String(Date.now()), n, s: want ? 1 : 0 }) });
    if (r.status === 401 || r.status === 403) { try { sessionStorage.removeItem("pw"); } catch (e) {} pending = null; msg("Wrong password."); }
    else if (!r.ok) { pending = null; msg("Could not send. Try again."); }
    else { try { sessionStorage.setItem("pw", pw); } catch (e) {} }
  } catch (e) { pending = null; msg("Could not send. Check your connection."); }
  render();
}
$("s1btn").onclick = () => sendCmd(1, !rel[1]);
$("s2btn").onclick = () => sendCmd(2, !rel[2]);
function updateButtons(alive, faulted) {
  for (const n of [1, 2]) {
    const b = $("s" + n + "btn"), on = rel[n];
    b.textContent = pending && pending.n === n ? "Working…" : on === null ? "Device offline" : on ? "Turn OFF" : "Turn ON";
    b.className = "swbtn" + (on ? " off" : "");
    b.disabled = !alive || faulted || on === null || !!pending;
  }
  if (faulted) msg("Fault: reset with the button on the board first.");
  else if ($("ctlMsg").textContent.startsWith("Fault")) msg("");
}

const isOn = v => v === true || v === 1 || v === "1" || String(v).toUpperCase() === "ON";
const num = v => (typeof v === "number" && isFinite(v)) ? v : null;
const fix = (v, d) => v === null ? "–" : v.toFixed(d);

function fake() {
  demoUp += 2; const c = Math.floor(demoUp / 20) % 3;
  return { i1: c === 1 ? 0 : 0.6 + Math.random() * .3, i2: 1.8 + Math.random() * .4, t: 30 + Math.random() * 3, r1: c !== 1, r2: true, fault: "none", up: demoUp };
}

async function poll() {
  try {
    let d;
    if (demo) d = fake();
    else { const r = await fetch(CONFIG.DATA_URL, { cache: "no-store" }); if (!r.ok) throw 0; d = await r.json(); }
    if (!d || typeof d !== "object") throw 0;
    const key = d.up !== undefined ? String(d.up) : JSON.stringify(d);
    if (key !== lastKey) {
      const first = lastKey === null;   // first load is only a baseline, not proof the device is alive
      lastKey = key;
      if (!first) {
        const now = Date.now(), p = ((num(d.i1) || 0) + (num(d.i2) || 0)) * CONFIG.VOLTAGE;
        if (lastChange) wh += p * Math.min((now - lastChange) / 1000, 10) / 3600;
        lastChange = now; peak = Math.max(peak, p);
        hist.push(p); if (hist.length > 60) hist.shift();
      }
    }
    last = d;
  } catch (e) {}
  render();
}

const ago = ms => { const s = Math.round(ms / 1000); return s < 60 ? s + " s ago" : s < 3600 ? Math.round(s / 60) + " min ago" : Math.round(s / 3600) + " h ago"; };

function setArc(id, txt, ratio) {
  $(id + "v").textContent = txt;
  const arc = $(id + "arc");
  arc.setAttribute("stroke-dasharray", (Math.min(Math.max(ratio, 0), 1) * CIRC) + " " + CIRC);
  arc.setAttribute("class", "fg" + (ratio >= 1 ? " bad" : ratio > .8 ? " warn" : ""));
}
function setG(id, txt, ratio, tag, tagOn, hint) {
  setArc(id, txt, ratio);
  const t = $(id + "tag"); t.textContent = tag; t.className = "tag" + (tagOn ? " on" : "");
  $(id + "h").textContent = hint;
}

function render() {
  $("clock").textContent = new Date().toLocaleTimeString();
  const age = Date.now() - lastChange, alive = last && age < CONFIG.OFFLINE_AFTER_MS;
  const fault = last ? String(last.fault || "none").toLowerCase() : "none", faulted = alive && fault !== "none";
  document.body.dataset.state = !alive ? "offline" : faulted ? "fault" : "online";

  if (!last) { $("stText").textContent = "Waiting for device"; $("stSub").textContent = "No data received yet."; }
  else if (!alive) { $("stText").textContent = "Device offline"; $("stSub").textContent = lastChange ? "Last seen " + ago(age) + ". Meters reset until it is back." : "No live data from the device."; }
  else if (faulted) { $("stText").textContent = fault === "overheat" ? "Overheat – sockets off" : "Overload – sockets off"; $("stSub").textContent = "Press a button on the board to reset."; }
  else { $("stText").textContent = "Device online"; $("stSub").textContent = "Updated " + ago(age) + "."; }
  if (!alive) {
    const lt = "Limit " + CONFIG.OVERLOAD_A + " A / " + CONFIG.OVERLOAD_A * CONFIG.VOLTAGE + " VA";
    for (const id of ["s1", "s2"]) { setG(id, "–", 0, "Offline", false, lt); setArc(id + "p", "–", 0); }
    setG("tm", "–", 0, "Offline", false, "Cut-off at " + CONFIG.OVERHEAT_C + " °C");
    $("tot").textContent = "–";
    $("fan").textContent = "Fan –"; $("fan").className = "tag";
    rel[1] = rel[2] = null; pending = null; updateButtons(false, false);
    return;
  }

  const i1 = num(last.i1), i2 = num(last.i2), t = num(last.t);
  const r1 = last.r1 === undefined ? null : isOn(last.r1), r2 = last.r2 === undefined ? null : isOn(last.r2);
  const rl = r => r === null ? "–" : r ? "● Socket ON" : "○ Socket OFF";
  rel[1] = r1; rel[2] = r2;
  if (pending && rel[pending.n] === pending.want) { pending = null; msg(""); }
  else if (pending && Date.now() > pending.until) { pending = null; msg("No response from the board."); }
  updateButtons(true, faulted);
  const lim = CONFIG.OVERLOAD_A * CONFIG.VOLTAGE, p1 = (i1 || 0) * CONFIG.VOLTAGE, p2 = (i2 || 0) * CONFIG.VOLTAGE;
  const lt = "Limit " + CONFIG.OVERLOAD_A + " A / " + lim + " VA";
  setG("s1", fix(i1, 2), (i1 || 0) / CONFIG.OVERLOAD_A, rl(r1), r1, lt); setArc("s1p", Math.round(p1), p1 / lim);
  setG("s2", fix(i2, 2), (i2 || 0) / CONFIG.OVERLOAD_A, rl(r2), r2, lt); setArc("s2p", Math.round(p2), p2 / lim);
  setG("tm", fix(t, 0), (t || 0) / CONFIG.OVERHEAT_C, "Limit " + CONFIG.OVERHEAT_C + "°C", false, "Cut-off at " + CONFIG.OVERHEAT_C + " °C");

  const fanOn = (t !== null && t > CONFIG.FAN_ON_C) || r1 || r2;
  $("fan").textContent = "Fan " + (fanOn ? "on" : "off"); $("fan").className = "tag" + (fanOn ? " on" : "");
  const total = ((i1 || 0) + (i2 || 0)) * CONFIG.VOLTAGE;
  $("tot").textContent = Math.round(total);
  $("wh").textContent = wh.toFixed(2); $("pk").textContent = Math.round(peak);
  const max = Math.max(100, ...hist);
  const pts = hist.map((v, k) => (k * 300 / Math.max(hist.length - 1, 1)).toFixed(1) + "," + (56 - v / max * 50).toFixed(1)).join(" ");
  $("spark").setAttribute("points", pts);
  $("area").setAttribute("points", hist.length ? pts + " 300,60 0,60" : "");
}

poll(); setInterval(poll, CONFIG.POLL_MS); setInterval(render, 1000);
</script>
</body>
</html>
